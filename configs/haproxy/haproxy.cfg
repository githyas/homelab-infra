global
    log /dev/log local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # Si un serveur ne répond pas, retenter la requête sur un autre serveur
    retries 3
    option redispatch

# Point d'entrée : tout le trafic HTTP arrive ici
frontend web_front
    bind *:80
    default_backend web_back

# Les serveurs web, interrogés à tour de rôle
backend web_back
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server web1 192.168.61.21:80 check inter 2s fall 2 rise 2
    server web2 192.168.61.22:80 check inter 2s fall 2 rise 2

# Page de statistiques
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
